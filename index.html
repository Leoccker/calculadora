<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcPro Enterprise AI — SaaS Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="saas-header">
    <div class="brand">
      <span class="badge">PRO CLOUD</span>
      <h1>CalcPro Enterprise AI</h1>
    </div>
    <span class="plan-status">Plano Gratuito (Cálculos ilimitados de entrada)</span>
  </header>

  <main class="saas-container">
    <section class="calculator" aria-label="Calculadora SaaS">
      <div class="display-wrapper">
        <div class="display-label">VISOR QUANTUM-CLOUD</div>
        <div id="display" class="display" role="status" aria-live="polite">0</div>
      </div>

      <div class="keypad">
        <button type="button" class="btn btn-clear" data-action="clear">C</button>
        <button type="button" class="btn btn-operator" data-value="/">/</button>
        <button type="button" class="btn btn-operator" data-value="*">*</button>
        <button type="button" class="btn btn-operator" data-value="-">-</button>

        <button type="button" class="btn" data-value="7">7</button>
        <button type="button" class="btn" data-value="8">8</button>
        <button type="button" class="btn" data-value="9">9</button>
        <button type="button" class="btn btn-operator btn-plus" data-value="+">+</button>

        <button type="button" class="btn" data-value="4">4</button>
        <button type="button" class="btn" data-value="5">5</button>
        <button type="button" class="btn" data-value="6">6</button>

        <button type="button" class="btn" data-value="1">1</button>
        <button type="button" class="btn" data-value="2">2</button>
        <button type="button" class="btn" data-value="3">3</button>
        <button type="button" class="btn btn-equal" data-action="equal">=</button>

        <button type="button" class="btn btn-zero" data-value="0">0</button>
        <button type="button" class="btn" data-value=".">.</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
